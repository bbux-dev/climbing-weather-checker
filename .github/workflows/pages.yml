name: Publish climbing weather report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest -v

      - name: Restore weather cache
        uses: actions/cache@v4
        with:
          path: .weather_cache
          key: weather-cache-${{ github.run_id }}
          restore-keys: |
            weather-cache-

      - name: Build static report
        run: |
          mkdir -p site/assets
          cp assets/local-crag-background.png site/assets/local-crag-background.png
          cd site
          python3 ../climb_weather.py --html index.html --refresh --cache-dir ../.weather_cache \
            || python3 ../climb_weather.py --html index.html --cache-dir ../.weather_cache

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
